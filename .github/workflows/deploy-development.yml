name: Deploy to Development Server

on:
  workflow_dispatch:

jobs:
  check_linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: "latest"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Lint code
        run: pnpm format:check

  testing:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}?pgbouncer=true&connection_limit=1
      DIRECT_URL: postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      TESTING_EMAIL: ${{ secrets.TESTING_EMAIL }}
      TESTING_PASSWORD: ${{ secrets.TESTING_PASSWORD }}
      LANG: sv_SE.UTF-8
      LANGUAGE: sv_SE:sv
      LC_ALL: sv_SE.UTF-8

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: "latest"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432; do
            sleep 1
          done

      - name: Run migrations
        run: pnpm db:migrate:dev

      - name: Run tests
        run: pnpm test

      - name: Upload Playwright Logs
        uses: actions/upload-artifact@v4.6.1
        if: failure()
        with:
          name: playwright-logs
          path: ./tests/logs

  deploy:
    needs: [check_linting, testing]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to development server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          script: |
            cd Stuns-Aterbrukslabbet/
            git checkout ${{ github.ref_name }}
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            pnpm i --frozen-lockfile
            pnpm build
            sudo shutdown -r +1 "Rebooting in 1 minute"
